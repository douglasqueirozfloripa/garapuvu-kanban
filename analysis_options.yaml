# Ferramental de qualidade — equivalente ao ESLint do template web.
# Roda com: flutter analyze   (ou make lint)
include: package:flutter_lints/flutter.yaml

analyzer:
  # Equivalente ao .eslintignore / .prettierignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - .dart_tool/**
    - coverage/**

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # No projeto didatico, codigo esquecido nao passa despercebido.
    todo: info
    # Documentacao publica ausente e aviso, nao erro, para nao travar rascunho.
    public_member_api_docs: info
    # Estas sao ERRO: nao entram no historico.
    unused_import: error
    unused_local_variable: error
    dead_code: error
    avoid_print: error

linter:
  rules:
    # --- Legibilidade (clean code comentado) ---
    always_declare_return_types: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_child_properties_last: true
    unnecessary_lambdas: true
    use_super_parameters: true

    # --- Documentacao ---
    public_member_api_docs: true
    slash_for_doc_comments: true

    # --- Seguranca / corretude ---
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    only_throw_errors: true
    unawaited_futures: true

    # --- Flutter ---
    use_build_context_synchronously: true
    use_colored_box: true
    use_decorated_box: true
    sized_box_for_whitespace: true
    avoid_unnecessary_containers: true
